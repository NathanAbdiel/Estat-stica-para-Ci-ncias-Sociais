  author: "Nathan Abdiel Campos dos Santos"
  date: "2026"
  search: true
  sidebar:
    style: "docked"
    search: true
  chapters:
    - index.qmd
    - importacao_leitura_diagnostico.qmd
    - manipulacao_limpeza_dados.qmd
