    code-fold: false         # Exibe os blocos prontos para cópia
    code-tools: true         # Ferramentas visuais nos blocos de código
    toc: true                # Sumário na direita da página
    toc-title: "Nesta página"
    number-sections: false   # Títulos limpos sem numeração forçada